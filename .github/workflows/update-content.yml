name: Update Content Submodule

on:
  repository_dispatch:
    types: [update-content-submodule]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT_PUSH }}
      - name: Update submodule
        run: |
          git submodule update --remote content
          git config --global user.email "kempkes.christoph@tuta.com"
          git config --global user.name "gvtsch"
          git add content
          git commit -m "Auto-update content submodule" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.PAT_PUSH }}@github.com/gvtsch/gvtsch.github.io.git HEAD:v4